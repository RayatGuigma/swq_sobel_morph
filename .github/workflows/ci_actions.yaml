name: CI Ubuntu - Compilation et execution

on:
  push:
    branches:
      - GitAction

  workflow_dispatch:

jobs: #travaux a realiser
  build_exe:   #nom de la tache
    runs-on: ubuntu-latest   # ebvironnement (OS) d'execution

    steps:
      # Recup code source
      - name: Recuperation des sources
        uses: actions/checkout@v4

      #installation des dependances
      - name: Installation des dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libsdl2-ttf-dev xvfb

      #data
      - name: Preparation des donnees
        run: mkdir -p dat

      #config cmake
      - name: Configuration CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --parallel 2

      #exec
      - name: Execution du programme
        run: xvfb-run -a ./build/Release/sobel


#uses pour  l'utilisation d'action existant
