name: CI Ubuntu ET Windows - Compilation et execution

on:
  push:
    branches:
      - GitAction

  workflow_dispatch:

jobs: #travaux a realiser
  build_exe_ubuntu:   #nom de la tache
    runs-on: ubuntu-latest   # ebvironnement (OS) d'execution

    steps:
      # Recup code source
      - name: Recuperation des sources
        uses: actions/checkout@v5

      #installation des dependances
      - name: Installation des dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev libsdl2-ttf-dev xvfb

      #data
      - name: Preparation des donnees
        run: mkdir -p dat

      #config cmake
      - name: Configuration CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --parallel 2

      #exec
      - name: Execution du programme
        run: xvfb-run -a ./build/Release/sobel


  
  build_windows:
    runs-on: windows-latest

    steps:
      - name: Recuperation des sources
        uses: actions/checkout@v5

      - name: Preparation des donnees
        run: mkdir dat

      - name: Configuration CMake
        run: cmake -S . -B build

      - name: Compilation
        run: cmake --build build --config Release --parallel 2
        
      - name: Recherche de l'executable
        run: |
          Get-ChildItem -Path build -Filter sobel.exe -Recurse

      - name: Execution
        run: .\build\Release\sobel.exe
        
        
        
