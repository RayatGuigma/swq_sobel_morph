name: ci Ubuntu : compilation et execution
on:
  push: #exe au push
   brnches: 
    -GitAction 
  workflow_dispatch: #lancer manuellement sans nv push 

jobs: #travaux a realiser
  build_exe: #nom de la tache
    runs-on: ubuntu-latest  # ebvironnement (OS) d'execution
    steps:
    - name: recuperation des codes src
      uses: actions/checkout@master
      
    - name: compilation
      run: |
        gcc -o sobel main.c
    - name: execution
      run: 
        ./sobel 

#uses pour  l'utilisation d'action existant
